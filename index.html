(function(){
const SKEL_HEAD='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>';
const D=JSON.parse(document.getElementById("data").textContent);
const TIME={1:"09:00",2:"10:00",3:"11:00",4:"12:00",5:"13:40",6:"14:40",7:"15:40"};
const DOW=["일","월","화","수","목","금","토"];
const PALETTE=["#2f6fb0","#b0466f","#7a5bb5","#1f8a6a","#c07a14","#8a5a3c","#2b8ea3","#5f7d1f","#a33b3b","#3b5aa3"];
const $=id=>document.getElementById(id);
const toD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};

let dirty=false, saving=false, canWrite=true, artifactApi=null;

$("root").innerHTML=`

/* ---------- 저장 ---------- */
const ORIGINAL=JSON.stringify(D);
let autoTimer=null;
function setStatus(t,cls){const s=$("status");s.textContent=t;s.className="status"+(cls?" "+cls:"")}
function changed(){
  dirty=JSON.stringify(D)!==ORIGINAL;
  $("btnSave").disabled=!dirty||saving||!canWrite;$("btnUndo").disabled=!dirty||saving;
  if(dirty)setStatus("저장 안 된 변경사항이 있어요","dirty");else setStatus(canWrite?"저장된 상태예요":"보기 전용");
  clearTimeout(autoTimer);
  if(dirty&&canWrite&&artifactApi)autoTimer=setTimeout(()=>{if(!$("dlg").open)save()},6000);
}
function buildHtml(){
  const sty=document.getElementById("sty").textContent;
  const app=document.getElementById("app").textContent;
  const json=JSON.stringify(D).replace(/</g,"\\u003c");
  const title=document.title||"컴소AI 면접지도 일정";
  return SKEL_HEAD+`<title>${esc(title)}</title>\n<style id="sty">${sty}</style>\n<script type="application/json" id="data">${json}<\/script>\n<div id="root"></div>\n<script id="app">${app}<\/script></body></html>`;
}
async function save(){
  clearTimeout(autoTimer);
  if(!dirty||saving)return;
  if(!artifactApi){setStatus("이 화면에서는 저장할 수 없어요. claude.ai에서 열어 주세요","dirty");return}
  saving=true;$("btnSave").disabled=true;setStatus("저장하는 중…");
  try{sessionStorage.setItem("iv_scroll",String(window.scrollY))}catch(e){}
  try{await artifactApi.publish(buildHtml());setStatus("저장했어요")}
  catch(err){
    saving=false;const c=err&&err.code;
    if(c==="conflict")setStatus("다른 분이 먼저 저장해서 최신 내용으로 다시 불러와요","dirty");
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"||c==="not_declared"){setReadOnly();setStatus("보기 전용이에요. 수정하려면 편집 권한이 필요해요","dirty")}
    else if(c==="rate_limited"){setStatus("저장이 너무 잦아요. 잠시 뒤 다시 눌러 주세요","dirty");changed()}
    else{setStatus("저장하지 못했어요. 잠시 뒤 다시 눌러 주세요","dirty");$("btnSave").disabled=false}
  }
}
function setReadOnly(){canWrite=false;document.body.classList.add("ro");renderCal()}
$("btnSave").addEventListener("click",save);
$("btnUndo").addEventListener("click",()=>{const o=JSON.parse(ORIGINAL);Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,o);render();changed()});
window.addEventListener("beforeunload",e=>{if(dirty&&!saving){e.preventDefault();e.returnValue=""}});

function renderHead(){
  $("title").textContent=D.title;
  const ds=D.sessions.map(x=>x.date).sort();
  $("summary").textContent=`지도교사 ${D.teachers} · 학생 ${D.students.length}명 · 지도 ${D.sessions.length}회`+(ds.length?` · ${fmt(ds[0])} ~ ${fmt(ds[ds.length-1])}`:"");
}
function sessOf(id){return D.sessions.filter(x=>x.sid===id).sort((a,b)=>(a.date+a.period).localeCompare(b.date+b.period))}
function renderTable(){
  const max=Math.max(2,...D.students.map(s=>sessOf(s.id).length));
  let h=`<tr><th>학생</th><th>지원 대학 · 1단계 발표 · 면접</th>`;
  for(let i=1;i<=max;i++)h+=`<th>지도 ${i}차</th>`;
  h+=`<th>첫 면접</th></tr>`;
  for(const s of D.students){
    const fi=firstIv(s),ses=sessOf(s.id);
    const unis=s.unis.map((u,i)=>`<div class="uni">
      <input type="text" id="u-${s.id}-${i}-name" aria-label="${esc(s.name)} 지원 대학" data-s="${s.id}" data-i="${i}" data-k="name" value="${esc(u.name)}">
      <label>발표 <input type="date" id="u-${s.id}-${i}-ann" data-s="${s.id}" data-i="${i}" data-k="ann" value="${u.ann||""}"></label>
      <label>면접 <input type="date" id="u-${s.id}-${i}-iv" data-s="${s.id}" data-i="${i}" data-k="iv" value="${u.iv||""}"></label>
      <button class="x edit-only" data-del-uni="${s.id}:${i}" aria-label="이 대학 삭제" title="이 대학 삭제">×</button></div>`).join("");
    h+=`<tr><td style="white-space:nowrap"><span class="dot" style="background:${s.color}"></span><b>${esc(s.name)}</b><br><span style="color:var(--muted);font-size:12.5px">${esc(s.hb)}</span></td>
      <td style="min-width:300px">${unis}<button class="link edit-only" data-add-uni="${s.id}">+ 대학 추가</button></td>`;
    for(let i=0;i<max;i++){const x=ses[i];
      h+=x?`<td class="sess ${fi&&x.date>=fi?"late":""}">${fmt(x.date)}<small>${x.period}교시 ${TIME[x.period]}</small></td>`:`<td style="color:var(--muted)">-</td>`;}
    h+=`<td class="due">${fmt(fi)}</td></tr>`;
  }
  $("stuTable").innerHTML=h;
}
$("stuTable").addEventListener("change",e=>{
  const t=e.target;if(!t.dataset.s||!canWrite)return;
  stu(t.dataset.s).unis[+t.dataset.i][t.dataset.k]=t.value;
  renderHead();renderCal();
  // 지도 셀(늦음 표시) 갱신, 입력 포커스 유지
  renderTable();
  changed();
});
$("stuTable").addEventListener("click",e=>{
  if(!canWrite)return;
  const a=e.target.closest("[data-add-uni]");
  if(a){stu(a.dataset.addUni).unis.push({name:"",ann:"",iv:""});renderTable();changed();return}
  const d=e.target.closest("[data-del-uni]");
  if(d){const[sid,i]=d.dataset.delUni.split(":");stu(sid).unis.splice(+i,1);render();changed()}
});

function renderFilter(){
  $("filter").innerHTML=`<button class="chip ${only?"":"on"}" data-n="">전체 보기</button>`+D.students.map(s=>`<button class="chip ${only===s.id?"on":""}" data-n="${s.id}"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</button>`).join("");
}
$("filter").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;only=b.dataset.n||null;try{sessionStorage.setItem("iv_filter",only||"")}catch(_){};renderFilter();renderCal()});

function calRange(){
  const all=[...D.sessions.map(x=>x.date),...D.memos.map(m=>m.date),...D.students.flatMap(s=>s.unis.flatMap(u=>[u.ann,u.iv]))].filter(Boolean).sort();
  const now=new Date();now.setHours(0,0,0,0);
  let a=all.length?toD(all[0]):new Date(now),b=all.length?toD(all[all.length-1]):new Date(now);
  // 지난 일정은 너무 길게 보이지 않도록: 오늘 2주 전부터
  const twoWeeksAgo=new Date(now);twoWeeksAgo.setDate(now.getDate()-14);
  if(a<twoWeeksAgo)a=twoWeeksAgo;
  if(b<now)b=new Date(now);
  a.setDate(a.getDate()-((a.getDay()+6)%7));b.setDate(b.getDate()+(7-b.getDay())%7);
  return[a,b];
}
function renderCal(){
  const ev={};const add=(k,o)=>(ev[k]=ev[k]||[]).push(o);
  for(const x of D.sessions){const s=stu(x.sid);if(!s)continue;
    const n=sessOf(s.id).indexOf(x)+1,fi=firstIv(s),bad=fi&&x.date>=fi;
    add(x.date,{k:1,o:x.period,sid:s.id,html:`<div class="ev s ${bad?"bad":""}" ${canWrite?'draggable="true"':""} tabindex="0" data-id="${x.id}" style="--c:${s.color}" title="${bad?"면접일 이후 일정이에요":canWrite?"클릭: 수정 · 끌기: 날짜 이동":""}">${esc(s.name)} ${n}차 · ${x.period}교시</div>`});}
  for(const s of D.students)for(const u of s.unis){if(!u.name)continue;const sh=esc(u.name.split(" ")[0]);
    if(u.ann)add(u.ann,{k:2,o:0,sid:s.id,html:`<div class="ev an" style="--c:${s.color}">${esc(s.name)} ${sh} 발표</div>`});
    if(u.iv)add(u.iv,{k:3,o:0,sid:s.id,html:`<div class="ev iv">${esc(s.name)} ${sh} 면접</div>`});}
  for(const m of D.memos)add(m.date,{k:0,o:0,html:`<div class="ev ${m.big?"big":"memo"}" tabindex="0" data-memo="${m.id}">${esc(m.text)}</div>`});
  let g=["월","화","수","목","금","토","일"].map(d=>`<div class="hd">${d}</div>`).join("");
  const[a,b]=calRange();const today=iso(new Date());
  for(const d=new Date(a);d<=b;d.setDate(d.getDate()+1)){
    const k=iso(d),w=d.getDay();
    const items=(ev[k]||[]).filter(e=>!only||!e.sid||e.sid===only).sort((p,q)=>p.k-q.k||p.o-q.o);
    const cls=["day"];if(w===0||w===6)cls.push("we");if(k===today)cls.push("today");
    const lab=(d.getDate()===1||+d===+a)?`${d.getMonth()+1}월 ${d.getDate()}일`:d.getDate();
    g+=`<div class="${cls.join(" ")}" data-date="${k}"><div class="top"><span class="n">${lab}</span><button class="add" data-add="${k}" aria-label="${fmt(k)} 일정 추가">+</button></div>${items.map(e=>e.html).join("")}</div>`;
  }
  $("cal").innerHTML=g;
}

/* 끌어서 옮기기 */
const cal=$("cal");let dragId=null;
cal.addEventListener("dragstart",e=>{const el=e.target.closest(".ev.s");if(!el||!canWrite)return;dragId=el.dataset.id;e.dataTransfer.setData("text/plain",dragId);e.dataTransfer.effectAllowed="move"});
cal.addEventListener("dragover",e=>{const d=e.target.closest(".day");if(!d||!dragId)return;e.preventDefault();cal.querySelectorAll(".drop").forEach(x=>x!==d&&x.classList.remove("drop"));d.classList.add("drop")});
cal.addEventListener("dragleave",e=>{const d=e.target.closest(".day");if(d&&!d.contains(e.relatedTarget))d.classList.remove("drop")});
cal.addEventListener("drop",e=>{const d=e.target.closest(".day");if(!d||!dragId)return;e.preventDefault();
  const x=D.sessions.find(s=>s.id===dragId);if(x&&x.date!==d.dataset.date){x.date=d.dataset.date;render();changed()}dragId=null});
cal.addEventListener("dragend",()=>{dragId=null;cal.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"))});

const dlg=$("dlg");let editing=null;
$("fPer").innerHTML=Object.entries(TIME).map(([p,t])=>`<option value="${p}">${p}교시 (${t})</option>`).join("");
function setType(t){$("fType").value=t;$("wrapStu").hidden=t!=="session";$("wrapPer").hidden=t!=="session";$("wrapMemo").hidden=t!=="memo"}
$("fType").addEventListener("change",e=>setType(e.target.value));
function openDlg(mode,obj,date){
  if(!canWrite)return;
  editing={obj};
  $("fStu").innerHTML=D.students.map(s=>`<option value="${s.id}">${esc(s.name)} (${esc(s.hb)})</option>`).join("");
  $("btnDel").hidden=!obj;$("fType").disabled=!!obj;
  if(mode==="memo"){setType("memo");$("fMemo").value=obj?obj.text:"";$("fDate").value=obj?obj.date:date;$("dlgTitle").textContent=obj?"메모 수정":"새 일정 추가"}
  else{setType("session");$("fStu").value=obj?obj.sid:(only||D.students[0].id);$("fDate").value=obj?obj.date:date;$("fPer").value=obj?obj.period:3;$("dlgTitle").textContent=obj?"면접지도 수정":"새 일정 추가"}
  dlg.showModal();
}
cal.addEventListener("click",e=>{
  const ad=e.target.closest("[data-add]");if(ad)return openDlg("session",null,ad.dataset.add);
  const s=e.target.closest(".ev.s");if(s)return openDlg("session",D.sessions.find(x=>x.id===s.dataset.id));
  const m=e.target.closest("[data-memo]");if(m)return openDlg("memo",D.memos.find(x=>x.id===m.dataset.memo));
});
cal.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches(".ev[tabindex]"))e.target.click()});
dlg.addEventListener("close",()=>{
  const v=dlg.returnValue;if(!editing)return;const{obj}=editing;const type=$("fType").value;editing=null;
  if(v==="delete"&&obj){if(type==="memo")D.memos=D.memos.filter(x=>x!==obj);else D.sessions=D.sessions.filter(x=>x!==obj)}
  else if(v==="ok"&&$("fDate").value){
    if(type==="memo"){const t=$("fMemo").value.trim();if(!t)return;if(obj){obj.text=t;obj.date=$("fDate").value}else D.memos.push({id:uid("m"),date:$("fDate").value,text:t})}
    else{const o=obj||{id:uid("a")};o.sid=$("fStu").value;o.date=$("fDate").value;o.period=+$("fPer").value;if(!obj)D.sessions.push(o)}
  }else return;
  render();changed();
});
